name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -D playwright@1.48.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
